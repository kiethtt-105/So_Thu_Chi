function openLim(){const L=S.lim,pars=[...new Set(S.cat.filter(c=>c.t==='Chi').map(c=>c.p))];ED=null;
$('#sh').innerHTML=`<h3>Hạn mức chi</h3><div class="f"><label>Mỗi ngày (₫)<input id="l_d" type="number" inputmode="numeric" value="${L.d||''}"></label><label>Mỗi tháng (₫)<input id="l_m" type="number" inputmode="numeric" value="${L.m||''}"></label>
<div class="w tabs" style="margin:6px 0"><button type="button" class="on" data-lt="gd">Theo ngày</button><button type="button" data-lt="gc">Theo tháng</button></div>
<div class="w f" id="gd">${pars.map(p=>`<label>${emo(p)} ${esc(p)}<input class="l_cd" data-p="${esc(p)}" type="number" inputmode="numeric" placeholder="₫ / ngày" value="${(L.cd||{})[p]||''}"></label>`).join('')}</div>
<div class="w f hide" id="gc">${pars.map(p=>`<label>${emo(p)} ${esc(p)}<input class="l_c" data-p="${esc(p)}" type="number" inputmode="numeric" placeholder="₫ / tháng" value="${(L.c||{})[p]||''}"></label>`).join('')}</div></div><button class="btn p w" data-lsave>Lưu hạn mức</button>`;openSheet()}
function ed(kind,o,idx){const L=[...new Set(S.cat.map(c=>c.p))],nm=S.acc.map(a=>a.name),isN=idx==null;ED={kind,o,idx};E=null;
const F={tk:[['name','Tên tài khoản','text',o.name],['type','Loại','text',o.type,['Tiền mặt','Ngân hàng','Thẻ tín dụng','Ví điện tử','Tiết kiệm']],['open','Số dư ban đầu','number',o.open]],
dm:[['t','Loại','select',o.t||'Chi',['Chi','Thu']],['p','Hạng mục cha','text',o.p,L],['c','Chi tiết','text',o.c]],
rec:[['type','Loại','select',o.type||'Chi',['Chi','Thu']],['amount','Số tiền','number',o.amount],['acc','Tài khoản','select',o.acc||nm[0],nm],['cat','Hạng mục','text',o.cat,L],['sub','Chi tiết','text',o.sub,S.cat.map(c=>c.c)],['note','Ghi chú','text',o.note],['day','Ngày trong tháng (1–31)','number',o.day||1]]}[kind];
$('#sh').innerHTML=`<h3>${isN?'Thêm':'Sửa'} ${{tk:'tài khoản',dm:'hạng mục',rec:'giao dịch định kỳ'}[kind]}</h3><div class="f">${F.map(([id,lb,ty,v,ls])=>kind==='rec'&&id==='cat'?catFields(o.type||'Chi',o.cat,o.sub,'e_cat','e_sub'):kind==='rec'&&id==='sub'?'':`<label class="${id==='note'||id==='name'||id==='c'?'w':''}">${lb}${ty==='select'?`<select id="e_${id}">${ls.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input id="e_${id}" type="${ty}" ${ty==='number'?'inputmode="numeric"':''} value="${esc(v??'')}" ${ls?`list="dl_${id}"`:''}>${ls?`<datalist id="dl_${id}">${[...new Set(ls)].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}`}</label>`).join('')}${kind==='tk'?`<div class="w"><span class="l" style="font-size:12px;color:var(--mut)">Biểu tượng</span><div class="cg" style="margin-top:6px"><button type="button" class="chip ${AI[o.name]?'':'on'}" data-ico="">Tự động</button>${EM.map(e=>`<button type="button" class="chip ${AI[o.name]===e?'on':''}" data-ico="${e}">${e}</button>`).join('')}</div></div>`:''}</div><button class="btn p w" data-esave>Lưu</button>${kind==='tk'&&!isN?'<button class="btn w" data-viewacc>Xem giao dịch của tài khoản này</button>':''}${isN?'':'<button class="btn d w" data-edel style="margin-top:2px">Chuyển vào Thùng rác</button>'}`;openSheet()}
$('#ov').addEventListener('input',e=>{if(e.target.id==='fa'){const neg=e.target.value.trim().startsWith('-'),v=e.target.value.replace(/[^\d]/g,'');e.target.value=(neg?'-':'')+(v?num(+v):'')}if(E&&['fc','fp','fs'].includes(e.target.id)){const id=e.target.id,val=e.target.value;pull();
if(id==='fp'){E.cat=val;if(E.sub&&!S.cat.some(c=>c.t===E.type&&c.p===E.cat&&c.c===E.sub))E.sub=''}
if(id==='fs'){if(val!==''){const c=S.cat[+val];E.cat=c.p;E.sub=c.c}else E.sub=''}form();$('#'+id).focus()}
if(ED&&ED.kind==='rec'&&['e_type','e_cat','e_sub'].includes(e.target.id)){const id=e.target.id,val=e.target.value,o=ED.o,g=k=>($('#e_'+k)||{}).value;o.type=g('type');o.amount=+g('amount')||0;o.acc=g('acc');o.note=g('note')||'';o.day=+g('day')||1;
if(id==='e_type'){o.cat=o.sub=''}else if(id==='e_cat'){o.cat=val;if(o.sub&&!S.cat.some(c=>c.t===o.type&&c.p===o.cat&&c.c===o.sub))o.sub=''}else if(val!==''){const c=S.cat[+val];o.cat=c.p;o.sub=c.c}else o.sub='';
ed(ED.kind,o,ED.idx);$('#'+id).focus()}});
$('#ov').addEventListener('click',e=>{const T=e.target;if(T.id==='ov')return closeSheet();const q=s=>T.closest(s);
if(q('[data-ico]')){const b=q('[data-ico]');document.querySelectorAll('[data-ico]').forEach(x=>x.classList.toggle('on',x===b));if(ED)ED.ico=b.dataset.ico;return}
if(q('[data-viewacc]')&&ED){Object.assign(S,{xa:ED.o.name,rg:'a',fo:true,f:'all',q:''});return go('tx')}
if(q('[data-sheettab]'))return go(q('[data-sheettab]').dataset.sheettab);if(q('[data-a2]')){closeSheet();return csv()}
if(q('[data-lt]')){const b=q('[data-lt]');document.querySelectorAll('[data-lt]').forEach(x=>x.classList.toggle('on',x===b));$('#gd').classList.toggle('hide',b.dataset.lt!=='gd');$('#gc').classList.toggle('hide',b.dataset.lt!=='gc');return}
if(q('[data-lsave]')){const c={},cd={};document.querySelectorAll('.l_c').forEach(i=>{if(+i.value>0)c[i.dataset.p]=+i.value});document.querySelectorAll('.l_cd').forEach(i=>{if(+i.value>0)cd[i.dataset.p]=+i.value});
S.lim={d:+$('#l_d').value||0,m:+$('#l_m').value||0,c,cd};localStorage.lim=JSON.stringify(S.lim);closeSheet();render();api('lim',{lim:S.lim}).then(j=>{apply(j);toast('Đã lưu hạn mức');render()}).catch(er=>toast('Đã lưu trên máy này, chưa đồng bộ: '+er.message));return}
if(ED){const v=id=>($('#e_'+id)||{}).value,{kind,o,idx}=ED;
if(q('[data-esave]')){if(kind==='tk'){const nm=v('name').trim(),old=o.name;if(ED.ico!==undefined){if(ED.ico)AI[nm]=ED.ico;else delete AI[nm];if(old&&old!==nm)delete AI[old]}else if(old&&old!==nm&&AI[old]){AI[nm]=AI[old];delete AI[old]}try{localStorage.aicon=JSON.stringify(AI)}catch(e){}}
if(kind==='tk')return act('accSave',{acc:{name:v('name').trim(),type:v('type'),open:+v('open')||0},old:o.name},'Đã lưu');
if(kind==='dm')return act('catSave',{cat:{t:v('t'),p:v('p').trim(),c:v('c').trim()},old:idx==null?null:{t:o.t,p:o.p,c:o.c}},'Đã lưu');
if(kind==='rec'){const r={id:o.id||Date.now().toString(36),type:v('type'),amount:+v('amount')||0,acc:v('acc'),cat:o.cat||'',sub:o.sub||'',note:v('note'),day:Math.min(31,Math.max(1,+v('day')||1))};if(!r.amount)return toast('Nhập số tiền');if(!r.cat||!r.sub)return toast('Chọn hạng mục và chi tiết');const L=S.rec.slice();idx==null?L.push(r):L[idx]=r;return act('recSet',{rec:L},'Đã lưu định kỳ')}}
if(q('[data-edel]')){if(!confirm('Chuyển vào Thùng rác? Dữ liệu vẫn được lưu ở tab DaXoa.'))return;
if(kind==='tk')return act('accDel',{name:o.name},'Đã chuyển vào Thùng rác');if(kind==='dm')return act('catDel',{cat:{t:o.t,p:o.p,c:o.c}},'Đã chuyển vào Thùng rác');if(kind==='rec')return act('recSet',{rec:S.rec.filter((_,i)=>i!==idx)},'Đã xóa định kỳ')}return}
if(!E)return;
if(q('[data-ty]')){pull();E.type=q('[data-ty]').dataset.ty;E.cat=E.sub='';form();return}
if(q('[data-dup]')){pull();E={...E,id:'G'+Date.now().toString(36),date:ymd(new Date()),isNew:true};form();return}
if(q('[data-del]')){if(!confirm('Chuyển giao dịch vào Thùng rác? Dữ liệu vẫn được lưu ở tab DaXoa và có thể khôi phục.'))return;const old=S.tx.slice(),id=E.id;S.tx=S.tx.filter(x=>x.id!==id);closeSheet();render();push('del',{id},()=>S.tx=old);return}
if(q('[data-save]')){pull();const ty=E.type;let er='';if(!E.amount||(E.amount<0&&ty!=='Điều chỉnh'))er='Nhập số tiền lớn hơn 0';else if(!E.acc)er='Chọn tài khoản';else if(ty==='Chuyển khoản'&&!E.accTo)er='Chọn tài khoản nhận';else if(ty!=='Chuyển khoản'&&ty!=='Điều chỉnh'&&(!E.cat||!E.sub))er='Chọn hạng mục và chi tiết';if(er)return toast(er);
const x=ty==='Chuyển khoản'||ty==='Điều chỉnh',row={id:E.id,date:E.date,type:ty,amount:E.amount,acc:E.acc,accTo:ty==='Chuyển khoản'?E.accTo:'',cat:x?'':E.cat,sub:x?'':E.sub,note:E.note},old=S.tx.slice(),isNew=E.isNew;
S.tx=S.tx.filter(t=>t.id!==row.id).concat(row);S.m=row.date.slice(0,7);closeSheet();render();push(isNew?'add':'upd',{row},()=>S.tx=old)}});
if(alive())boot();
</script></body></html>
