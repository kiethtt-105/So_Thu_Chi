<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B4F59"><title>Sổ Thu Chi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B4F59'/%3E%3Cpath d='M30 62l14-14 10 10 18-22' stroke='%23fff' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2F0;--card:#fff;--ink:#10242B;--mut:#62777D;--line:#DCE6E3;--acc:#0B4F59;--acc2:#0E7C86;--thu:#23814F;--chi:#C4432C;--chuyen:#3F5FB5;--dc:#B07412;--r:16px}
*{box-sizing:border-box;margin:0}html{-webkit-text-size-adjust:100%}
body{font:400 15px/1.45 'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;padding-bottom:calc(84px + env(safe-area-inset-bottom))}

:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.hide{display:none!important}
#login{position:fixed;inset:0;z-index:50;overflow:auto;display:grid;place-items:center;padding:24px;background:var(--acc);color:#fff}
#login form{width:min(340px,100%);text-align:center}
#login h1{font-size:30px;font-weight:700;margin:14px 0 6px}#login p{opacity:.75;margin-bottom:26px}

#lerr{height:22px;margin-top:10px;font-size:14px;color:#FFC9BD}.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#EDF2F0ee;backdrop-filter:blur(10px)}
header b{font-size:18px;flex:1}header small{color:var(--mut);font-size:12px}
.ib{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line)}
.spin svg{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
main{max-width:760px;margin:0 auto;padding:4px 16px 24px}
.hero{background:var(--acc);color:#fff;border-radius:22px;padding:22px 20px;margin-bottom:14px}
.hero small{opacity:.7}.hero .big{font-size:clamp(30px,9vw,42px);font-weight:700;letter-spacing:-.02em;margin:2px 0 14px}
.hero .row{display:flex;gap:10px}.hero .pill{flex:1;background:#ffffff1c;border-radius:12px;padding:9px 12px;font-size:13px}.hero .pill b{display:block;font-size:16px}
.mn{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}.mn b{font-size:16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.card h3{font-size:15px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.two .card{margin:0}.two small{color:var(--mut)}.two b{font-size:19px;display:block}
.thu{color:var(--thu)}.chi{color:var(--chi)}.chuyen{color:var(--chuyen)}.dc{color:var(--dc)}
.bar{margin-bottom:11px}.bar div:first-child{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}.bar i{display:block;height:8px;border-radius:5px;background:var(--line);overflow:hidden}.bar i s{display:block;height:100%;background:var(--acc2);border-radius:5px;transition:width .5s}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}.tx:last-child{border:0}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;background:#0000000a}
.tx .m{flex:1;min-width:0}.tx .m b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx .m small{color:var(--mut)}.tx>b{font-weight:700;white-space:nowrap}
.dh{font-size:13px;color:var(--mut);margin:14px 2px 2px;font-weight:500}
.chips{display:flex;gap:8px;overflow:auto;margin:10px 0}.chip{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-size:14px}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.empty{text-align:center;color:var(--mut);padding:34px 10px}.empty b{display:block;color:var(--ink);margin-bottom:4px}
.acc{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.acc:last-child{border:0}.acc small{color:var(--mut);display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}

.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--acc2);color:#fff;font-size:30px;box-shadow:0 8px 20px #0b4f5955;z-index:7}
.ov{position:fixed;inset:0;background:#10242b66;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}.ov.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .25s;max-width:560px;margin:0 auto}.ov.open .sheet{transform:none}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-radius:12px;padding:3px;margin-bottom:14px}.seg button{padding:8px 2px;border-radius:10px;font-size:13px}.seg .on{background:#fff;font-weight:700;box-shadow:0 1px 3px #0002}
.amt{width:100%;font-size:34px;font-weight:700;border:0;border-bottom:2px solid var(--line);padding:6px 0;margin-bottom:12px;background:none}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{display:block;font-size:12px;color:var(--mut)}.f .w{grid-column:1/-1}
.f input,.f select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-top:3px}
.save{width:100%;margin-top:16px;padding:14px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700}.del{width:100%;margin-top:8px;padding:12px;color:var(--chi);font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#10242b;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:90vw}#toast.on{opacity:1;transform:translate(-50%,0)}
.sk{height:90px;border-radius:16px;background:linear-gradient(90deg,#e3ebe8,#f2f6f5,#e3ebe8);background-size:200%;animation:sk 1.2s infinite;margin-bottom:14px}@keyframes sk{to{background-position:-200%}}
.rr{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.rr:last-child{border:0}.rr>span:first-child{flex:1;min-width:0}.rr small{display:block;color:var(--mut)}.ba{width:132px;text-align:right;padding:10px;border-radius:12px;border:1px solid var(--line);font-weight:700;background:#fff}.df{width:86px;text-align:right;font-size:13px;font-weight:700}.note{color:var(--mut);font-size:13px;margin-bottom:6px}

.live{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap}.live i{width:9px;height:9px;border-radius:50%;background:#aaa}
.live.ok{color:#17803D}.live.ok i{background:#22C55E;animation:pl 1.6s infinite}.live.err{color:#C4332C}.live.err i{background:#E5484D}.live.wait{color:#9A6B00}.live.wait i{background:#E5A100}
@keyframes pl{0%{box-shadow:0 0 0 0 #22C55E99}70%,100%{box-shadow:0 0 0 7px #22C55E00}}
@media(min-width:900px){body{padding-left:200px;padding-bottom:0}nav{top:0;right:auto;width:200px;flex-direction:column;justify-content:flex-start;gap:4px;padding:80px 12px;border:0;border-right:1px solid var(--line)}nav button{flex:none;display:flex;justify-content:flex-start;gap:10px;font-size:15px;padding:12px;border-radius:12px}main{max-width:880px}header{padding-inline:max(24px,calc((100vw - 200px - 880px)/2 + 16px))}nav button.on{background:var(--bg)}.fab{bottom:28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== PRO THEME ===== */
:root{--bg:#F1F0FB;--card:#fff;--ink:#1B1840;--mut:#7A7799;--line:#E6E3F7;--acc:#5B3DF5;--acc2:#8B5CF6;--thu:#10B981;--chi:#F43F5E;--chuyen:#3B82F6;--dc:#F59E0B;--g:linear-gradient(135deg,#5B3DF5,#8B5CF6 55%,#EC4899)}
body.dark{--bg:#0F0D1F;--card:#1A1733;--ink:#EEEDFF;--mut:#9A97BD;--line:#2B2850}
body{background:radial-gradient(900px 400px at 0 -10%,#8B5CF633,transparent),radial-gradient(700px 400px at 100% 0,#EC489922,transparent),var(--bg);transition:background .3s}
header{background:color-mix(in srgb,var(--bg) 80%,transparent)}
.hero,#login{background:var(--g)!important;box-shadow:0 14px 34px #5b3df544}
.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:#ffffff1f}
.card{box-shadow:0 6px 20px #5b3df50d;border:0;transition:transform .2s}.card:hover{transform:translateY(-2px)}
.two .card:first-child{background:linear-gradient(135deg,#10B98122,var(--card))}.two .card:last-child{background:linear-gradient(135deg,#F43F5E22,var(--card))}
.ib,.chip,.search,.f input,.f select,.ba,.live,nav,.sheet,.amt{background:var(--card);color:var(--ink);border-color:var(--line)}
.chip.on,.save,nav button.on{background:var(--g);color:#fff}nav button.on{background:none;color:var(--acc2)}
.fab{background:var(--g);box-shadow:0 10px 26px #8b5cf688;animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-4px)}}
.bar i s{background:var(--bc,var(--acc2))}.dot{font-size:19px}
.seg .on{background:var(--card)}.cd{display:flex;align-items:center;gap:18px}.cd svg{flex:none}.cd ul{list-style:none;padding:0;flex:1;font-size:13px}.cd li{display:flex;gap:6px;align-items:center;margin:4px 0}.cd li i{width:10px;height:10px;border-radius:3px;flex:none}.cd li span{flex:1}
.ins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.ins div{border-radius:14px;padding:11px;color:#fff;font-size:12px}.ins b{display:block;font-size:15px;margin-top:2px}
#warn{background:#F59E0B22;color:var(--dc);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}

.hb .hero .big,.hb .acc>b,.hb .pill b{filter:blur(9px)}
.dash>.card,.dash>.two,.dash>.ins{margin-bottom:0}.dash{display:grid;gap:14px}
@media(min-width:900px){main:has(.dash){max-width:1100px}.dash{grid-template-columns:1fr 1fr}.dash>.hero,.dash>.mn,.dash>.ins,.dash>#warn,.dash>.two,.dash>.calc{grid-column:1/-1}}
.sm{display:grid;gap:8px;font-size:14px}.sm div{display:flex;justify-content:space-between}.sm div:last-child{border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:11px}.cal i{font-style:normal;color:var(--mut)}.cal span{border-radius:10px;padding:6px 0;min-height:44px;background:var(--bg)}.cal span b{display:block;font-size:13px}.cal span small{font-size:10px;color:var(--chi);font-weight:700}

.fp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.fp label{font-size:11px;color:var(--mut)}.fp select,.fp input{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-top:2px}.fp .w{grid-column:1/-1}
.tsum{display:flex;gap:8px;margin:8px 0;font-size:12px;flex-wrap:wrap}.tsum span{background:var(--card);border-radius:10px;padding:6px 10px}.dh.over{color:var(--chi);font-weight:700}
</style></head><body>
<section id="login"><form id="lf"><svg width="56" height="56" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#fff"/><path d="M30 62l14-14 10 10 18-22" stroke="#0B4F59" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
<h1>Sổ Thu Chi</h1><p>Nhập mật khẩu để mở sổ</p><input id="pw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••" aria-label="Mật khẩu" autofocus><button class="go" id="lb">Mở sổ</button><div id="lerr" role="alert"></div></form></section>
<div id="app" class="hide">
<header><div style="flex:1"><b>Sổ Thu Chi</b><br><small id="st">Đang tải…</small></div><span class="live wait" id="live" role="status" aria-live="polite"><i></i><b>Đang kết nối</b></span><button class="ib" id="rf" aria-label="Đồng bộ"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button><button class="ib" id="lo" aria-label="Khóa sổ"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button></header>
<main id="v"></main>
<nav id="nav"></nav><button class="fab" id="fab" aria-label="Thêm giao dịch">+</button>
</div>
<div class="ov" id="ov"><div class="sheet" id="sh" role="dialog" aria-modal="true"></div></div><div id="toast" role="status"></div>
<script>
const PASS='0000'; // mật khẩu đăng nhập (đổi tại đây)
const TTL=12*3600e3,alive=()=>{const t=+localStorage.sess||0;return t&&Date.now()-t<TTL},touch=()=>{localStorage.sess=Date.now()};
const API='https://script.google.com/macros/s/AKfycbznLXXBUWBGhPbmfPal7FDN6WD7gQPqcdGLsRFEcvImPtbMKwhVEaBljv_7Jt2j_3g7/exec';
const $=s=>document.querySelector(s),vnd=n=>new Intl.NumberFormat('vi-VN').format(Math.round(n))+' ₫',num=n=>new Intl.NumberFormat('vi-VN').format(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TYPES=['Chi','Thu','Chuyển khoản','Điều chỉnh'],CLS={Thu:'thu',Chi:'chi','Chuyển khoản':'chuyen','Điều chỉnh':'dc'},SIGN={Thu:'+',Chi:'−','Chuyển khoản':'⇄','Điều chỉnh':'±'};
const NAV=[['home','Tổng quan','◧'],['tx','Giao dịch','☰'],['acc','Tài khoản','▣'],['rec','Cân đối','⚖'],['cat','Hạng mục','◈']];
let S={act:{},tx:[],acc:[],cat:[],m:ymd(new Date()).slice(0,7),tab:'home',f:'all',q:'',ready:false,busy:0},E=null;
try{const c=JSON.parse(sessionStorage.cache||'null');if(c){Object.assign(S,c);S.ready=true}}catch(e){}
async function api(a,d={}){let r;const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),20000);try{r=await fetch(API,{method:'POST',signal:ac.signal,body:JSON.stringify({a,...d})})}catch(e){throw Error('Không có kết nối mạng')}finally{clearTimeout(tm)}
const j=await r.json();if(!j.ok)throw Error(j.err||'Lỗi máy chủ');return j}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.i);toast.i=setTimeout(()=>e.classList.remove('on'),2600)}
function apply(j){S.tx=j.tx;S.acc=j.acc;S.cat=j.cat;S.sig=sigOf(j);if(j.h)S.h=j.h;S.ready=true;sessionStorage.cache=JSON.stringify({tx:S.tx,acc:S.acc,cat:S.cat});$('#st').textContent='Đã đồng bộ '+new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}
const sigOf=j=>JSON.stringify([j.tx,j.acc,j.cat,j.lim]),POLL_MS=2000;
const setLive=s=>{const e=$('#live');if(!e||e.dataset.s===s)return;e.dataset.s=s;e.className='live '+s;e.lastChild.textContent={ok:'Live',err:'Mất kết nối',wait:'Đang kết nối'}[s]};
async function sync(quiet){$('#rf').classList.add('spin');try{apply(await api('all'));S.err='';setLive('ok');render()}catch(e){setLive('err');S.err=e.message;if(!quiet)toast(e.message);$('#st').textContent='Chưa đồng bộ được';if(!S.ready)render()}$('#rf').classList.remove('spin')}
async function push(a,d,undo){S.busy++;$('#rf').classList.add('spin');try{apply(await api(a,d));toast('Đã lưu')}catch(e){undo();toast('Chưa lưu được: '+e.message)}S.busy--;if(!S.busy)$('#rf').classList.remove('spin');render()}
function lock(){sessionStorage.clear();localStorage.removeItem('sess');$('#app').classList.add('hide');$('#login').classList.remove('hide');$('#pw').value='';$('#ov').classList.remove('open')}
$('#lf').onsubmit=ev=>{ev.preventDefault();if($('#pw').value===PASS){touch();boot()}
else{$('#lerr').textContent='Mật khẩu không đúng';$('#lf').classList.remove('shake');void $('#lf').offsetWidth;$('#lf').classList.add('shake');$('#pw').select()}};
function boot(){$('#login').classList.add('hide');$('#app').classList.remove('hide');render();sync(true)}
$('#rf').onclick=()=>sync();$('#lo').onclick=lock;$('#fab').onclick=()=>openForm();
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(!alive())return lock();sync(true)});
let inflight=false,fails=0,skip=0;
const typing=()=>{const a=document.activeElement;return !!(a&&a.closest&&a.closest('#v')&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))};
async function poll(){if(!alive()){if(!$('#app').classList.contains('hide'))lock();return}
if(inflight||document.hidden||S.busy)return;if(fails>3&&++skip%5)return;
inflight=true;try{const j=await api('all',{h:S.h});fails=0;setLive('ok');S.err='';
if(!j.same&&sigOf(j)!==S.sig){const first=!S.ready;apply(j);if(!first)toast('Có giao dịch mới');S.dirty=true;if(!typing()){S.dirty=false;render()}}}
catch(e){fails++;setLive('err')}inflight=false}
setInterval(poll,POLL_MS);
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.dirty&&!typing()){S.dirty=false;render()}},60));
addEventListener('offline',()=>setLive('err'));addEventListener('online',()=>{fails=0;poll()});
['click','keydown'].forEach(t=>document.addEventListener(t,()=>{if(alive())touch()},{passive:true}));
// ---- tính toán
const sums=m=>{let thu=0,chi=0;S.tx.forEach(t=>{if(t.date.slice(0,7)!==m)return;if(t.type==='Thu')thu+=t.amount;if(t.type==='Chi')chi+=t.amount});return{thu,chi}};
const bal=a=>{let b=a.open;S.tx.forEach(t=>{const x=t.amount;if(t.acc===a.name){if(t.type==='Thu'||t.type==='Điều chỉnh')b+=x;else b-=x}if(t.type==='Chuyển khoản'&&t.accTo===a.name)b+=x});return b};
const mlabel=m=>'Tháng '+m.slice(5)+'/'+m.slice(0,4),shift=(m,d)=>{const t=new Date(+m.slice(0,4),+m.slice(5)-1+d,1);return ymd(t).slice(0,7)};
const monthNav=()=>`<div class="mn"><button class="ib" data-m="-1" aria-label="Tháng trước">‹</button><b>${mlabel(S.m)}</b><button class="ib" data-m="1" aria-label="Tháng sau">›</button></div>`;
function txRow(t){const c=CLS[t.type],ttl=t.type==='Chuyển khoản'?`${esc(t.acc)} → ${esc(t.accTo)}`:esc(t.sub||t.cat||(t.type==='Chi'||t.type==='Thu'?'Chưa phân loại':t.type));
return `<button class="tx" data-edit="${esc(t.id)}"><span class="dot ${c}">${SIGN[t.type]}</span><span class="m"><b>${ttl}</b><small>${esc(t.note||t.cat||'')}${t.type==='Chuyển khoản'?'':' · '+esc(t.acc)}</small></span><b class="${c}">${t.type==='Chi'?'−':t.type==='Thu'?'+':''}${num(t.amount)}</b></button>`}
const empty=(a,b)=>`<div class="empty"><b>${a}</b>${b}</div>`;

function home(){const{thu,chi}=sums(S.m),total=S.acc.reduce((s,a)=>s+bal(a),0),by={};

const diffs=()=>S.acc.map(a=>{const sys=bal(a),v=S.act[a.name],has=v!==undefined;return{a,sys,has,act:v,diff:has?v-sys:0}});
function recon(){const D=diffs();return `<div class="hero"><small>Chênh lệch (thực tế − hệ thống)</small><div class="big" id="rt">–</div><div class="row"><div class="pill">Hệ thống<b id="rs">–</b></div><div class="pill">Thực tế<b id="ra">–</b></div></div></div>

function reconUpdate(){const D=diffs(),has=D.filter(x=>x.has),tot=has.reduce((s,x)=>s+x.diff,0),sg=n=>(n>0?'+':'−')+vnd(Math.abs(n));

$('#rbtn').innerHTML=(bad.length?`<button class="save" data-bdo="adj">Tạo điều chỉnh số dư (${bad.length} tài khoản)</button>`+(pos&&neg?`<button class="save" style="background:var(--chuyen)" data-bdo="xfer">${tot===0?'Ghi nhận là chuyển khoản giữa các tài khoản':'Chuyển khoản phần bù trừ, điều chỉnh phần còn lại'}</button>`:''):has.length?empty('Đã khớp','Số dư thực tế trùng với hệ thống.'):'')+`<button class="chip" style="margin-top:12px" data-bdo="form">Chuyển tiền giữa các tài khoản</button>`}
function doBal(k){if(k==='form')return openForm(null,'Chuyển khoản');

home=function(){let h=_home2();const{thu,chi}=sums(S.m),M=S.tx.filter(t=>t.date.slice(0,7)===S.m);
const dn=(ty,tt)=>{const by={};M.filter(t=>t.type===ty).forEach(t=>{const k=t.cat||t.sub||'Khác';by[k]=(by[k]||0)+t.amount});const r=Object.entries(by).sort((a,b)=>b[1]-a[1]),tot=r.reduce((a,x)=>a+x[1],0),R=48,C=2*Math.PI*R;let o=0;
return `<div class="card"><h3>${tt}</h3>${r.length?`<div class="cd"><svg width="130" height="130" viewBox="0 0 120 120">${r.map(([k,v],i)=>{const l=v/tot*C,x=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${colOf(k,i+3)}" stroke-width="20" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=l;return x}).join('')}</svg><ul>${r.slice(0,5).map(([k,v],i)=>`<li><i style="background:${colOf(k,i+3)}"></i><span>${emo(k)} ${esc(k)}</span><b>${Math.round(v/tot*100)}%</b></li>`).join('')}</ul></div>`:empty('Chưa có dữ liệu','')}</div>`};
const y=+S.m.slice(0,4),mo=+S.m.slice(5),dim=new Date(y,mo,0).getDate(),off=(new Date(y,mo-1,1).getDay()+6)%7,dc={};
M.filter(t=>t.type==='Chi').forEach(t=>dc[+t.date.slice(8)]=(dc[+t.date.slice(8)]||0)+t.amount);const mx=Math.max(1,...Object.values(dc)),sh=n=>n>=1e6?(n/1e6).toFixed(1)+'tr':Math.round(n/1e3)+'k';
const cal=`<div class="card cal-w cal" style="display:block"><h3>Lịch chi tiêu tháng</h3><div class="cal">${['T2','T3','T4','T5','T6','T7','CN'].map(d=>`<i>${d}</i>`).join('')}${'<span style="background:none"></span>'.repeat(off)}${Array.from({length:dim},(_,i)=>{const v=dc[i+1];return `<span style="${v?`background:rgba(244,63,94,${.12+.4*v/mx})`:''}"><b>${i+1}</b>${v?`<small>${sh(v)}</small>`:''}</span>`}).join('')}</div></div>`.replace('class="card cal-w cal" style="display:block"','class="card cal-wrap"');
const sm=`<div class="card"><h3>Tổng quan tháng</h3><div class="sm"><div><span>Tổng thu</span><b class="thu">${vnd(thu)}</b></div><div><span>Tổng chi</span><b class="chi">${vnd(chi)}</b></div><div><span>Chênh lệch</span><b>${vnd(thu-chi)}</b></div></div></div>`;
h=h.replace('<div class="card"><h3>Chi theo hạng mục</h3>',dn('Thu','Thu tiền')+sm+'<div class="card"><h3>Chi theo hạng mục</h3>');
return '<div class="dash">'+h+cal.replace('class="card cal-wrap"','class="card calc"')+'</div>'};

// ===== LỌC / SẮP XẾP / HẠN MỨC =====
try{S.lim=JSON.parse(localStorage.lim||'null')||{d:0,m:0,c:{}}}catch(e){S.lim={d:0,m:0,c:{}}}
Object.assign(S,{rg:'m',so:'dn',xa:'',xc:'',mn:'',mx:'',d1:'',d2:'',fo:false});
txs=function(){const q=S.q.toLowerCase();let l=S.tx.filter(t=>{
if(S.rg==='m'&&t.date.slice(0,7)!==S.m)return false;if(S.rg==='c'&&((S.d1&&t.date<S.d1)||(S.d2&&t.date>S.d2)))return false;
if(S.f!=='all'&&t.type!==S.f)return false;if(S.xa&&t.acc!==S.xa&&t.accTo!==S.xa)return false;if(S.xc&&t.cat!==S.xc)return false;
if(S.mn!==''&&t.amount<+S.mn)return false;if(S.mx!==''&&t.amount>+S.mx)return false;
return !q||[t.note,t.cat,t.sub,t.acc,t.accTo,String(t.amount)].join(' ').toLowerCase().includes(q)});
const dsort=S.so==='dn'||S.so==='do';l.sort({dn:(a,b)=>b.date.localeCompare(a.date),do:(a,b)=>a.date.localeCompare(b.date),ah:(a,b)=>b.amount-a.amount,al:(a,b)=>a.amount-b.amount}[S.so]);
const thu=l.filter(t=>t.type==='Thu').reduce((a,t)=>a+t.amount,0),chi=l.filter(t=>t.type==='Chi').reduce((a,t)=>a+t.amount,0),dt={};l.forEach(t=>{if(t.type==='Chi')dt[t.date]=(dt[t.date]||0)+t.amount});
let h='',last='';l.forEach(t=>{if(dsort&&t.date!==last){last=t.date;const d=new Date(t.date+'T00:00'),ov=S.lim.d&&dt[t.date]>S.lim.d;h+=`<div class="dh ${ov?'over':''}">${d.toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit'})}${dt[t.date]?' · chi '+num(dt[t.date])+(ov?' ⚠️ vượt hạn mức':''):''}</div>`}h+=txRow(t)});
const op=(a,v,ph)=>`<option value="">${ph}</option>`+a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join(''),pars=[...new Set(S.cat.map(c=>c.p))],n=[S.xa,S.xc,S.mn,S.mx,S.d1,S.d2].filter(x=>x!=='').length+(S.rg!=='m'?1:0);
return `${S.rg==='m'?monthNav():''}<input class="search" id="q" placeholder="Tìm theo ghi chú, hạng mục, số tiền" value="${esc(S.q)}"><div class="chips">${['all',...TYPES].map(t=>`<button class="chip ${S.f===t?'on':''}" data-f="${t}">${t==='all'?'Tất cả':t}</button>`).join('')}<button class="chip ${n?'on':''}" data-x="fo">⚙ Bộ lọc${n?' ('+n+')':''}</button></div>
${S.fo?`<div class="card"><div class="fp"><label class="w">Thời gian<select id="x_rg"><option value="m" ${S.rg==='m'?'selected':''}>Theo tháng đang xem</option><option value="a" ${S.rg==='a'?'selected':''}>Toàn bộ thời gian</option><option value="c" ${S.rg==='c'?'selected':''}>Khoảng ngày tùy chọn</option></select></label>
${S.rg==='c'?`<label>Từ ngày<input type="date" id="x_d1" value="${S.d1}"></label><label>Đến ngày<input type="date" id="x_d2" value="${S.d2}"></label>`:''}
<label>Tài khoản<select id="x_acc">${op(S.acc.map(a=>a.name),S.xa,'Tất cả')}</select></label><label>Hạng mục<select id="x_cat">${op(pars,S.xc,'Tất cả')}</select></label>
<label>Số tiền từ<input type="number" id="x_mn" inputmode="numeric" value="${S.mn}"></label><label>Đến<input type="number" id="x_mx" inputmode="numeric" value="${S.mx}"></label>
<label class="w">Sắp xếp<select id="x_so">${[['dn','Mới nhất trước'],['do','Cũ nhất trước'],['ah','Số tiền: cao → thấp'],['al','Số tiền: thấp → cao']].map(([k,v])=>`<option value="${k}" ${S.so===k?'selected':''}>${v}</option>`).join('')}</select></label></div><button class="chip" data-x="rs">Xóa bộ lọc</button></div>`:''}
<div class="tsum"><span>${l.length} giao dịch</span><span class="thu">Thu ${vnd(thu)}</span><span class="chi">Chi ${vnd(chi)}</span><span>Ròng ${vnd(thu-chi)}</span></div>
<div class="card" style="padding:4px 16px">${l.length?h:empty('Không có giao dịch','Thử đổi bộ lọc hoặc khoảng thời gian.')}</div><button class="chip" data-csv>Tải CSV toàn bộ</button>`};
document.addEventListener('click',e=>{const t=e.target.closest('[data-x]');if(!t)return;const x=t.dataset.x;
if(x==='fo')S.fo=!S.fo;else if(x==='rs'){Object.assign(S,{xa:'',xc:'',mn:'',mx:'',d1:'',d2:'',so:'dn',rg:'m',f:'all',q:''})}else if(x==='lim')return openLim();render()});
document.addEventListener('change',e=>{const k={x_rg:'rg',x_acc:'xa',x_cat:'xc',x_mn:'mn',x_mx:'mx',x_so:'so',x_d1:'d1',x_d2:'d2'}[e.target.id];if(k){S[k]=e.target.value;render()}});
function openLim(){const L=S.lim,pars=[...new Set(S.cat.filter(c=>c.t==='Chi').map(c=>c.p))];
$('#sh').innerHTML=`<h3 style="margin-bottom:6px">Hạn mức chi</h3><p class="note">Để trống hoặc 0 = không giới hạn. Đồng bộ qua Google Sheet.</p><div class="f"><label>Mỗi ngày (₫)<input id="l_d" type="number" inputmode="numeric" value="${L.d||''}"></label><label>Mỗi tháng (₫)<input id="l_m" type="number" inputmode="numeric" value="${L.m||''}"></label><label class="w" style="font-weight:700;margin-top:8px">Theo hạng mục (mỗi tháng)</label>${pars.map(p=>`<label>${emo(p)} ${esc(p)}<input class="l_c" data-p="${esc(p)}" type="number" inputmode="numeric" value="${(L.c||{})[p]||''}"></label>`).join('')}</div><button class="save" data-lsave>Lưu hạn mức</button>`;$('#ov').classList.add('open')}
$('#sh').addEventListener('click',async e=>{if(!e.target.closest('[data-lsave]'))return;const c={};document.querySelectorAll('.l_c').forEach(i=>{if(+i.value>0)c[i.dataset.p]=+i.value});
S.lim={d:+$('#l_d').value||0,m:+$('#l_m').value||0,c};localStorage.lim=JSON.stringify(S.lim);closeForm();render();try{apply(await api('lim',{lim:S.lim}));toast('Đã lưu hạn mức');render()}catch(er){toast('Đã lưu trên máy này, chưa đồng bộ: '+er.message)}});
const _home3=home;
home=function(){let h=_home3();const L=S.lim||{},now=ymd(new Date()),M=S.tx.filter(t=>t.type==='Chi'&&t.date.slice(0,7)===S.m),tot=M.reduce((a,t)=>a+t.amount,0),td=S.tx.filter(t=>t.type==='Chi'&&t.date===now).reduce((a,t)=>a+t.amount,0);
const bar=(lb,v,lim)=>{const r=v/lim,c=r>1?'var(--chi)':r>.8?'var(--dc)':'var(--thu)';return `<div class="bar" style="--bc:${c}"><div><span>${lb}</span><b>${vnd(v)} / ${vnd(lim)} <small style="color:${c}">${Math.round(r*100)}%</small></b></div><i><s style="width:${Math.min(100,r*100)}%"></s></i></div>`};
let b='';if(L.d)b+=bar('Hôm nay',td,L.d);if(L.m)b+=bar(mlabel(S.m),tot,L.m);const by={};M.forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);Object.entries(L.c||{}).forEach(([k,v])=>b+=bar(emo(k)+' '+esc(k),by[k]||0,v));
const days=new Set(M.map(t=>t.date));let ov=0;if(L.d){const d={};M.forEach(t=>d[t.date]=(d[t.date]||0)+t.amount);ov=Object.values(d).filter(v=>v>L.d).length}
const card=`<div class="card"><h3>Hạn mức chi <button class="chip" style="float:right;padding:3px 10px" data-x="lim">⚙ Thiết lập</button></h3>${b||'<p class="note">Chưa đặt hạn mức. Bấm Thiết lập để đặt hạn mức theo ngày, tháng và hạng mục.</p>'}${L.d&&ov?`<p class="note" style="color:var(--chi)">⚠️ ${ov} ngày trong tháng vượt hạn mức ngày.</p>`:''}</div>`;
return h.replace('<div class="card"><h3>Chi theo hạng mục</h3>',card+'<div class="card"><h3>Chi theo hạng mục</h3>')};
const _push=push;push=async function(a,d,u){await _push(a,d,u);if(a!=='del'&&d.row&&d.row.type==='Chi'&&S.lim.d){const v=S.tx.filter(t=>t.type==='Chi'&&t.date===d.row.date).reduce((x,t)=>x+t.amount,0);if(v>S.lim.d)toast('⚠️ Vượt hạn mức chi ngày: '+vnd(v)+' / '+vnd(S.lim.d))}};
if(alive())boot();
</script></body></html>
