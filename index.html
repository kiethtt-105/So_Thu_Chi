<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1B2C"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sổ Thu Chi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230F6E6E'/%3E%3Cpath d='M30 62l14-14 10 10 18-22' stroke='%23fff' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Sổ Thu Chi">
<link rel="stylesheet" href="css/style.css">
</head><body>
<section id="login"><form id="lf"><div class="logo" style="width:54px;height:54px;border-radius:15px;margin:auto;background:#fff;color:#0F6E6E"><svg class="i" viewBox="0 0 24 24" style="width:28px;height:28px;stroke-width:2.4"><path d="M5 16l5-5 4 4 6-8"/></svg></div>
<h1>Sổ Thu Chi</h1><p>Nhập mật khẩu để mở sổ</p><input id="pw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••" aria-label="Mật khẩu" autofocus><button class="go" id="lb">Mở sổ</button><div id="lerr" role="alert"></div></form></section>
<div id="app" class="hide">
<aside id="sb"></aside>
<div class="wrap">
<header class="top"><div class="brand"><span class="logo"><svg class="i" viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M5 16l5-5 4 4 6-8"/></svg></span><span>Sổ Thu Chi<small id="st2"></small></span></div><span id="st"></span>
<span class="live wait" id="live" role="status" aria-live="polite"><i></i><b>Đang kết nối</b></span>
<button class="ib hide" id="isb" data-a="issues" aria-label="Dữ liệu cần sửa" title="Dữ liệu cần kiểm tra"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"/></svg><span class="bdg" id="isn">0</span></button>
<button class="ib" id="nb" data-nt="open" aria-label="Thông báo" title="Thông báo"><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg><span class="bdg hide" id="nbn">0</span></button>
<button class="ib" data-a="hide" aria-label="Ẩn/hiện số dư" title="Ẩn/hiện số dư"><svg class="i" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
<button class="ib" data-a="dark" aria-label="Đổi giao diện" title="Sáng/tối"><svg class="i" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
<button class="ib" id="rf" data-a="sync" aria-label="Đồng bộ" title="Đồng bộ ngay"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
<button class="ib" data-a="lock" aria-label="Khóa sổ" title="Khóa sổ"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
<button class="pri" data-a="new"><svg class="i" viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M12 5v14M5 12h14"/></svg>Thêm giao dịch</button></header>
<div id="qb" class="hide"><div class="qrow"><input id="qin" autocomplete="off" enterkeyhint="done" placeholder="Gõ nhanh: cơm gà 30k · grab 45k hôm qua · +lương 15tr" aria-label="Nhập giao dịch nhanh"><button type="button" class="qe" id="qed" title="Mở form để chỉnh (Ctrl+Enter)" aria-label="Mở form">✎</button><button type="button" class="qs" id="qsv">Lưu</button></div><div id="qpv" aria-live="polite"></div><div id="qtp" class="chips"></div></div>
<main id="v"></main></div>
<nav id="bn"></nav><button class="fab" data-a="new" aria-label="Thêm giao dịch"><svg class="i" viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div class="ov" id="ov"><div class="sheet" id="sh" role="dialog" aria-modal="true"></div></div><div id="cf" role="alertdialog" aria-modal="true"><div class="box"><div class="ic" id="cfi"></div><h4 id="cft"></h4><div class="msg" id="cfm"></div><div class="bt"><button id="cfn">Hủy</button><button class="ok" id="cfo">OK</button></div></div></div><div id="toast" role="status"></div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/notify.js"></script>
<script src="js/upload.js"></script>
<script src="js/main.js"></script>
</body></html>
