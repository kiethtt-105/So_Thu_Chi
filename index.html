async function call(ops,rev){
  if(!API)throw Error('Thiếu địa chỉ API: file config.js chưa được tải');
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),30000);let r;
  try{r=await fetch(API,{method:'POST',signal:ac.signal,body:JSON.stringify({ops:ops||[],rev:rev||''})})}catch(e){throw Error('Không có kết nối mạng')}finally{clearTimeout(tm)}
  let j;try{j=await r.json()}catch(e){throw Error('Apps Script chưa cấp quyền hoặc chưa Deploy bản mới (máy chủ không trả về JSON)')}
  if(!j.ok){if(/Hành động không hợp lệ/i.test(j.err||''))throw Error('Apps Script đang chạy bản cũ. Dán Code.gs v5 → Triển khai → Quản lý bản triển khai → Phiên bản mới.');throw Error(j.err||'Lỗi máy chủ')}
  return j}
function stamp(){const t='Đã đồng bộ '+new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});$('#st').textContent=t;$('#st2').textContent=t}
function apply(j){stamp();if(j.same)return false;
  ['tx','acc','cat','lim','trash','issues'].forEach(k=>S[k]=j[k]||[]);S.rev=j.rev;S.ready=true;
  try{sessionStorage.cache=JSON.stringify({tx:S.tx,acc:S.acc,cat:S.cat,lim:S.lim,trash:S.trash,issues:S.issues})}catch(e){}return true}
const setLive=s=>{const e=$('#live');if(!e||e.dataset.s===s)return;e.dataset.s=s;e.className='live '+s;e.lastChild.textContent={ok:'Live',err:'Mất kết nối',wait:'Đang kết nối'}[s]};
const spin=on=>$('#rf').classList.toggle('spin',on);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.i);toast.i=setTimeout(()=>e.classList.remove('on'),3200)}
const typing=()=>{const a=document.activeElement;return !!(a&&a.closest&&a.closest('#v')&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))};
let inflight=false,fails=0,skip=0;
async function sync(manual){   // Gsheet → web
  if(inflight||(!manual&&(S.busy||document.hidden)))return;if(!manual&&fails>3&&++skip%5)return;
  inflight=true;if(manual)spin(1);
  try{const first=!S.synced,j=await call([],manual?'':S.rev);S.synced=true;fails=0;setLive('ok');S.err='';
    if(apply(j)){if(!first&&!manual)toast('Có dữ liệu mới từ Gsheet');if(typing())S.dirty=true;else render()}else if(manual)toast('Đã đồng bộ')}
  catch(e){fails++;setLive('err');S.err=e.message;if(manual)toast(e.message);$('#st').textContent='Chưa đồng bộ được';if(!S.ready)render()}
  inflight=false;if(manual)spin(0)}
let chain=Promise.resolve();
function commit(ops,o={}){   // web → Gsheet: gửi thao tác, nhận lại toàn bộ dữ liệu thật (thay mọi dự đoán cục bộ)
  if(o.local)o.local();render();S.busy++;spin(1);
  chain=chain.then(async()=>{let res={ok:true};
    try{apply(await call(ops,''));setLive('ok');toast(o.ok||'Đã lưu')}
    catch(e){res={ok:false,err:e.message};toast('Chưa lưu được: '+e.message);try{apply(await call([],''))}catch(_){}}
    S.busy--;if(!S.busy)spin(0);render();return res});
  return chain}
async function act(ops,msg){const r=await commit(ops,{ok:msg});if(r.ok)closeSheet();else{const o=$('#ov.open #sh');if(o){let m=$('#serr');if(!m){m=document.createElement('p');m.id='serr';m.className='chi';m.style.cssText='margin-top:10px;font-size:13px';o.appendChild(m)}m.textContent='Lỗi: '+r.err}}return r}

function boot(){$('#login').classList.add('hide');$('#app').classList.remove('hide');render();sync(true)}

/* ---- HẠN MỨC ----
 Quy tắc (giống hệt tab HanMuc trong Gsheet):
  • Kỳ = Ngày | Tháng.  Hạng mục trống = tổng chi; có tên = hạng mục CHA.
  • Chỉ tính giao dịch loại Chi.  Ngày: theo từng ngày lịch.  Tháng: theo từng tháng lịch.      */
const limOf=(per,cat)=>(S.lim.find(l=>l.per===per&&l.cat===cat)||{}).v||0;
function limCalc(){const today=ymd(new Date()),chi=S.tx.filter(t=>t.type==='Chi'),M=chi.filter(t=>inM(t,S.m)),sum=(a,c)=>a.reduce((s,t)=>(!c||t.cat===c)?s+t.amount:s,0);
  return S.lim.map(L=>{const name=L.cat||'Tổng chi';
    if(L.per==='Ngày'){const pd={};M.forEach(t=>{if(!L.cat||t.cat===L.cat)pd[t.date]=(pd[t.date]||0)+t.amount});const days=Object.entries(pd).filter(([,a])=>a>L.v).map(([d,a])=>[d,a-L.v]);
      return{...L,name,used:sum(chi.filter(t=>t.date===today),L.cat),over:days.length,excess:days.reduce((s,x)=>s+x[1],0),days}}
    const used=sum(M,L.cat);return{...L,name,used,over:used>L.v?1:0,excess:Math.max(0,used-L.v),days:[]}})
  .sort((a,b)=>(a.cat?1:0)-(b.cat?1:0)||a.name.localeCompare(b.name,'vi'))}
function limWarn(r){if(!r||r.type!=='Chi')return;const W=[],sm=f=>S.tx.filter(t=>t.type==='Chi'&&f(t)).reduce((x,t)=>x+t.amount,0);
  S.lim.forEach(L=>{if(L.cat&&L.cat!==r.cat)return;const v=L.per==='Ngày'?sm(t=>t.date===r.date&&(!L.cat||t.cat===L.cat)):sm(t=>mOf(t)===mOf(r)&&(!L.cat||t.cat===L.cat));if(v>L.v)W.push((L.cat||'Tổng chi')+' vượt '+vnd(v-L.v)+(L.per==='Ngày'?' trong ngày':' trong tháng'))});

function donut(rows,tot,off=0,fi=emo){if(!rows.length||!tot)return empty('Chưa có dữ liệu');const R=48,C=2*Math.PI*R;let o=0;

${S.fo?`<div class="card" style="margin-bottom:12px"><div class="fp"><label class="l w">Thời gian<select id="x_rg"><option value="m" ${S.rg==='m'?'selected':''}>Theo tháng đang xem</option><option value="a" ${S.rg==='a'?'selected':''}>Toàn bộ thời gian</option><option value="c" ${S.rg==='c'?'selected':''}>Khoảng ngày tùy chọn</option></select></label>

<label class="l">Tài khoản<select id="x_acc">${op(S.acc.map(a=>a.name),S.xa,'Tất cả')}</select></label><label class="l">Hạng mục<select id="x_cat">${op(pars,S.xc,'Tất cả')}</select></label>

function limPage(){const LC=limCalc(),D=LC.filter(x=>x.per==='Ngày'),M=LC.filter(x=>x.per==='Tháng'),O=LC.filter(x=>x.over).sort((a,b)=>b.excess-a.excess),tot=O.reduce((s,x)=>s+x.excess,0),now=new Date();

/* ---- CÂN ĐỐI ----
 Lệch số dư → CHỈ ghi “Điều chỉnh – chênh lệch không xác định”. Không tự suy ra chuyển khoản hay nguồn gốc nào khác.
 Muốn ghi chuyển khoản thật thì dùng nút “Chuyển tiền giữa các tài khoản”.                                   */
const diffs=()=>S.acc.map(a=>{const sys=bal(a),v=S.act[a.name],has=v!==undefined;return{a,sys,has,act:v,diff:has?v-sys:0}});
function recon(){const D=diffs();return head('Cân đối','So số dư thực tế với hệ thống; lệch thì ghi chênh lệch không xác định')+
`<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div class="card kpi h kfull"><small>Tổng chênh lệch</small><b class="sens" id="r_t">–</b><em id="r_n"></em></div><div class="card kpi"><small>Hệ thống</small><b class="sens" id="r_s">–</b></div><div class="card kpi"><small>Thực tế</small><b class="sens" id="r_a">–</b></div></div>
<div class="grid c"><div class="card"><div class="ch">Nhập số dư thực tế</div>${D.map((x,i)=>`<div class="rr"><span style="display:flex;align-items:center;gap:10px">${aIco(x.a)}<span style="min-width:0"><b style="font-weight:500">${esc(x.a.name)}</b><small class="sens">Hệ thống: ${vnd(x.sys)}</small></span></span><input class="ba money" data-neg="1" data-i="${i}" inputmode="text" placeholder="${num(x.sys)}" value="${x.has?num(x.act):''}" aria-label="Số dư thực tế ${esc(x.a.name)}"><span class="df" id="df${i}"></span></div>`).join('')||empty('Chưa có tài khoản')}</div>
<div class="card"><div class="ch">Xử lý</div><div id="rbtn"></div></div></div>`}
function reconUpdate(){const D=diffs(),has=D.filter(x=>x.has),tot=has.reduce((s,x)=>s+x.diff,0),sg=n=>(n>0?'+':'−')+vnd(Math.abs(n)),bad=has.filter(x=>x.diff!==0);
D.forEach((x,i)=>{const e=$('#df'+i);if(e){e.textContent=!x.has?'':x.diff===0?'Khớp':sg(x.diff).replace(' ₫','');e.className='df '+(!x.has?'':x.diff===0?'thu':'chi')}});
$('#r_t').textContent=has.length?(!bad.length?'Khớp':tot===0?'0 ₫ (nhưng lệch từng tài khoản)':sg(tot)):'–';
$('#r_n').textContent=has.length?(bad.length?bad.length+'/'+has.length+' tài khoản lệch':'Tất cả khớp'):'';
$('#r_s').textContent=vnd((has.length?has:D).reduce((s,x)=>s+x.sys,0));$('#r_a').textContent=has.length?vnd(has.reduce((s,x)=>s+x.act,0)):'–';
const pos=bad.some(x=>x.diff>0),neg=bad.some(x=>x.diff<0);
$('#rbtn').innerHTML=(bad.length?`<button class="btn p w" data-bdo="adj" style="margin-top:0">Ghi chênh lệch không xác định (${bad.length} tài khoản)</button><p class="note">Mỗi tài khoản lệch sẽ có <b>1 giao dịch “Điều chỉnh”</b> đúng bằng số lệch, ghi chú <b>“Chênh lệch không xác định”</b>.${pos&&neg?` <b>Lưu ý:</b> có tài khoản dư, có tài khoản thiếu${tot===0?' và tổng lệch bằng 0':''} — vẫn chưa biết tiền đi đâu nên hệ thống <b>không tự coi là chuyển khoản</b>. Nếu bạn biết chắc đó là chuyển tiền thì dùng nút bên dưới.`:''}</p>`:has.length?empty('Đã khớp','Số dư thực tế trùng với hệ thống.'):'<p class="mut" style="margin-bottom:6px">Nhập số dư thực tế để xem chênh lệch.</p>')+`<button class="btn w" data-bdo="form">Chuyển tiền giữa các tài khoản</button>`}
function doBal(k){if(k==='form')return openForm(null,'Chuyển khoản');const today=ymd(new Date()),L=diffs().filter(x=>x.has&&x.diff!==0);if(!L.length)return;
  if(!confirm('Ghi '+L.length+' giao dịch “Điều chỉnh – chênh lệch không xác định”?\n\n'+L.map(x=>x.a.name+': '+(x.diff>0?'+':'−')+num(Math.abs(x.diff))).join('\n')))return;
  const rows=L.map((x,i)=>({id:newId(i),date:today,type:'Điều chỉnh',amount:x.diff,acc:x.a.name,accTo:'',cat:'',sub:'',note:'Chênh lệch không xác định (cân đối)'}));
  S.act={};commit(rows.map(row=>({op:'tx.save',row})),{ok:'Đã ghi '+rows.length+' điều chỉnh',local:()=>{S.tx=S.tx.concat(rows)}})}

function accs(){const bs=S.acc.map(a=>({a,b:bal(a)})),tot=bs.reduce((s,x)=>s+x.b,0),pos=bs.filter(x=>x.b>0).reduce((s,x)=>s+x.b,0),neg=bs.filter(x=>x.b<0).reduce((s,x)=>s+x.b,0),mo={};
S.tx.forEach(t=>{if(!inM(t,S.m))return;const o=mo[t.acc]=mo[t.acc]||{thu:0,chi:0};if(t.type==='Thu')o.thu+=t.amount;if(t.type==='Chi')o.chi+=t.amount});

const grp=types.map(t=>{const l=bs.filter(x=>x.a.type===t),sub=l.reduce((s,x)=>s+x.b,0);return `<div class="card flush"><div class="ch" style="padding-top:14px;margin:0"><span>${(ATYPE[t]||['🏦'])[0]} ${esc(t)} <small>· ${l.length} tài khoản</small></span><b class="sens ${sub<0?'chi':''}">${vnd(sub)}</b></div>${l.map(({a,b})=>{const i=S.acc.indexOf(a),m=mo[a.name]||{thu:0,chi:0};return `<button class="row" data-ed="tk:${i}">${aIco(a)}<span class="m"><b>${esc(a.name)}</b><small class="sens">${mlabel(S.m)}: <span class="thu">+${num(m.thu)}</span> · <span class="chi">−${num(m.chi)}</span></small></span><b class="sens ${b<0?'chi':''}">${vnd(b)}</b></button>`}).join('')}</div>`}).join('');

`<div class="kpis">${kpi('Tổng tài sản ròng',vnd(tot),tot<0?'chi':'','Sau khi trừ nợ','h')}${kpi('Tiền đang có',vnd(pos),'thu',bs.filter(x=>x.b>0).length+' tài khoản')}${kpi('Đang nợ',vnd(neg),neg<0?'chi':'',bs.filter(x=>x.b<0).length+' tài khoản')}${kpi('Thu − chi '+mlabel(S.m).toLowerCase(),vnd(th-ch),th-ch<0?'chi':'thu','+'+num(th)+' / −'+num(ch))}</div>
<div class="grid a" style="align-items:start"><div class="col">${grp||`<div class="card">${empty('Chưa có tài khoản','Bấm “Thêm tài khoản” để bắt đầu.')}</div>`}</div><div class="card"><div class="ch">Phân bổ tài sản</div>${donut(pie,pos,0,k=>'')}</div></div>`}

if(t.classList&&t.classList.contains('money'))fm(t);
if(t.classList&&t.classList.contains('ba')){const a=S.acc[+t.dataset.i];if(!a)return;if(t.value.replace(/[^\d]/g,''))S.act[a.name]=pm(t.value);else delete S.act[a.name];reconUpdate()}});
document.addEventListener('change',e=>{const k={x_rg:'rg',x_acc:'xa',x_cat:'xc',x_mn:'mn',x_mx:'mx',x_so:'so',x_d1:'d1',x_d2:'d2'}[e.target.id];if(k){S[k]=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')return closeSheet();if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||'')||!$('#login').classList.contains('hide'))return;
if(e.key==='n'||e.key==='N'){e.preventDefault();openForm()}if(e.key==='/'){e.preventDefault();go('tx');setTimeout(()=>{const q=$('#q');q&&q.focus()},0)}});
function csv(){const r=[['ID','Ngày','Loại','Số tiền','Tài khoản','Tài khoản đến','Hạng mục cha','Hạng mục con','Ghi chú'],...S.tx.map(t=>[t.id,t.date,t.type,t.amount,t.acc,t.accTo,t.cat,t.sub,t.note])];
const b=new Blob(['\ufeff'+r.map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='so-thu-chi.csv';a.click()}

/* =============== HỘP THOẠI =============== */
const openSheet=()=>$('#ov').classList.add('open'),closeSheet=()=>$('#ov').classList.remove('open');
function openMore(){$('#sh').innerHTML=`<h3>Thêm</h3><div class="menu">${['acc','cat','tr'].map(k=>`<button class="row" data-sheettab="${k}">${ic(k)}<span class="m"><b>${TABS.find(x=>x[0]===k)[1]}</b></span>${k==='tr'&&S.trash.length?`<small class="mut">${S.trash.length}</small>`:''}</button>`).join('')}<button class="row" data-a2="csv">${ic('dl')}<span class="m"><b>Tải CSV toàn bộ</b></span></button></div>`;ED=null;E=null;openSheet()}
function openIssues(){const L=S.issues;ED=null;E=null;$('#sh').innerHTML=`<h3>Dữ liệu trong Gsheet cần sửa (${L.length})</h3><p class="note" style="margin:0 0 8px"><b>Đỏ</b> = lỗi, dòng đó <b>chưa được tính</b> vào số liệu. <b>Vàng</b> = cảnh báo, vẫn được tính. Mở tab tương ứng trong Gsheet, ô sai đã được tô màu kèm ghi chú lý do. Sửa xong web tự cập nhật.</p>${L.slice(0,80).map(i=>`<div class="iss ${i.lv}"><b>${esc(i.sheet)} · dòng ${i.row}</b><span>${esc(i.msg)}</span></div>`).join('')}${L.length>80?`<p class="mut" style="margin-top:8px">… và ${L.length-80} mục nữa</p>`:''}`;openSheet()}
function catFields(ty,cat,sub,ip,is){const L=S.cat.map((c,i)=>({...c,i})).filter(c=>c.t===ty),pars=[...new Set(L.map(c=>c.p))],o=c=>`<option value="${c.i}" ${c.p===cat&&c.c===sub?'selected':''}>${esc(c.c)}</option>`;
return `<label>Hạng mục<select id="${ip}"><option value="">Chọn…</option>${pars.map(p=>`<option ${p===cat?'selected':''}>${esc(p)}</option>`).join('')}</select></label><label>Chi tiết<select id="${is}"><option value="">${cat?'Chọn…':'Chọn (tự điền hạng mục)…'}</option>${cat?L.filter(c=>c.p===cat).map(o).join(''):pars.map(p=>`<optgroup label="${esc(p)}">${L.filter(c=>c.p===p).map(o).join('')}</optgroup>`).join('')}</select></label>`}
function openForm(t,ty){E=t?{...t}:{id:newId(),date:ymd(new Date()),type:ty||'Chi',amount:0,acc:(S.acc[0]||{}).name||'',accTo:'',cat:'',sub:'',note:'',isNew:true};ED=null;form();openSheet()}
function form(){const ty=E.type,op=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
$('#sh').innerHTML=`<div class="seg">${TYPES.map(x=>`<button data-ty="${x}" class="${x===ty?'on':''}">${x==='Chuyển khoản'?'Chuyển':x}</button>`).join('')}</div>
<input class="amt money ${CLS[ty]}" ${ty==='Điều chỉnh'?'data-neg="1"':''} id="fa" inputmode="${ty==='Điều chỉnh'?'text':'numeric'}" placeholder="0" value="${E.amount?num(E.amount):''}" aria-label="Số tiền"><div class="f">
<label>Ngày<input type="date" id="fd" value="${E.date}"></label><label>${ty==='Chuyển khoản'?'Từ tài khoản':'Tài khoản'}<select id="fc">${op(S.acc.map(a=>a.name),E.acc)}</select></label>
${ty==='Chuyển khoản'?`<label class="w">Đến tài khoản<select id="ft"><option value="">Chọn…</option>${op(S.acc.map(a=>a.name).filter(n=>n!==E.acc),E.accTo)}</select></label>`:ty==='Điều chỉnh'?'':catFields(ty,E.cat,E.sub,'fp','fs')}
<label class="w">Ghi chú<input id="fn" value="${esc(E.note)}" placeholder="Không bắt buộc"></label></div>
<button class="btn p w" data-save>${E.isNew?'Lưu giao dịch':'Lưu thay đổi'}</button>${E.isNew?'':'<button class="btn w" data-dup>⧉ Nhân đôi giao dịch</button><button class="btn d w" data-del style="margin-top:2px">Xóa giao dịch</button>'}`}
function pull(){const g=i=>($(i)||{}).value;E.date=g('#fd')||E.date;E.acc=g('#fc')||E.acc;E.note=g('#fn')||'';if($('#ft'))E.accTo=g('#ft');E.amount=pm($('#fa').value)}
function openLim(){ED=null;E=null;const pars=[...new Set(S.cat.filter(c=>c.t==='Chi').map(c=>c.p))],orph=[...new Set(S.lim.filter(l=>l.cat&&!pars.includes(l.cat)).map(l=>l.cat))],all=['',...pars,...orph];
const list=per=>all.map(p=>`<label class="${p===''?'w':''}">${p===''?'∑ Tổng chi (tất cả hạng mục)':emo(p)+' '+esc(p)+(orph.includes(p)?' ⚠️ không còn trong DanhMuc':'')}<input class="lm money" data-per="${per}" data-cat="${esc(p)}" inputmode="numeric" placeholder="Không đặt" value="${limOf(per,p)?num(limOf(per,p)):''}"></label>`).join('');
$('#sh').innerHTML=`<h3>Thiết lập hạn mức chi</h3><div class="tabs" style="margin-bottom:12px"><button type="button" class="on" data-lt="gd">Theo ngày</button><button type="button" data-lt="gc">Theo tháng</button></div>
<div class="f" id="gd">${list('Ngày')}</div><div class="f hide" id="gc">${list('Tháng')}</div><p class="note">Để trống hoặc 0 = bỏ hạn mức. Chỉ tính giao dịch Chi. Lưu vào tab <b>HanMuc</b> của Gsheet.</p><button class="btn p w" data-lsave>Lưu hạn mức</button>`;openSheet()}
function ed(kind,o,idx){const L=[...new Set(S.cat.map(c=>c.p))],isN=idx==null;ED={kind,o,idx};E=null;
const F={tk:[['name','Tên tài khoản','text',o.name],['type','Loại','select',o.type||ACC_TYPES[0],ACC_TYPES],['open','Số dư ban đầu','money',o.open?num(o.open):'']],
dm:[['t','Loại','select',o.t||'Chi',['Chi','Thu']],['p','Hạng mục cha','text',o.p,L],['c','Chi tiết','text',o.c]]}[kind];
$('#sh').innerHTML=`<h3>${isN?'Thêm':'Sửa'} ${{tk:'tài khoản',dm:'hạng mục'}[kind]}</h3><div class="f">${F.map(([id,lb,ty,v,ls])=>`<label class="${id==='name'||id==='c'?'w':''}">${lb}${ty==='select'?`<select id="e_${id}">${ls.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`:ty==='money'?`<input id="e_${id}" class="money" data-neg="1" inputmode="text" value="${esc(v)}" placeholder="0">`:`<input id="e_${id}" type="text" value="${esc(v??'')}" ${ls?`list="dl_${id}"`:''}>${ls?`<datalist id="dl_${id}">${ls.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}`}</label>`).join('')}${kind==='tk'?`<div class="w"><span class="l" style="font-size:12px;color:var(--mut)">Biểu tượng (chỉ lưu trên máy này)</span><div class="cg" style="margin-top:6px"><button type="button" class="chip ${AI[o.name]?'':'on'}" data-ico="">Tự động</button>${EM.map(e=>`<button type="button" class="chip ${AI[o.name]===e?'on':''}" data-ico="${e}">${e}</button>`).join('')}</div></div>`:''}</div><button class="btn p w" data-esave>Lưu</button>${kind==='tk'&&!isN?'<button class="btn w" data-viewacc>Xem giao dịch của tài khoản này</button>':''}${isN?'':'<button class="btn d w" data-edel style="margin-top:2px">Chuyển vào Thùng rác</button>'}`;openSheet()}
$('#ov').addEventListener('input',e=>{const t=e.target;if(t.classList.contains('money'))fm(t);
if(E&&['fc','fp','fs'].includes(t.id)){const id=t.id,val=t.value;pull();if(id==='fp'){E.cat=val;if(E.sub&&!S.cat.some(c=>c.t===E.type&&c.p===E.cat&&c.c===E.sub))E.sub=''}
if(id==='fs'){if(val!==''){const c=S.cat[+val];E.cat=c.p;E.sub=c.c}else E.sub=''}form();$('#'+id).focus()}});
$('#ov').addEventListener('click',e=>{const T=e.target;if(T.id==='ov')return closeSheet();const q=s=>T.closest(s);
if(q('[data-ico]')){const b=q('[data-ico]');$$('[data-ico]').forEach(x=>x.classList.toggle('on',x===b));if(ED)ED.ico=b.dataset.ico;return}
if(q('[data-viewacc]')&&ED){Object.assign(S,{xa:ED.o.name,rg:'a',fo:true,f:'all',q:''});return go('tx')}
if(q('[data-sheettab]'))return go(q('[data-sheettab]').dataset.sheettab);if(q('[data-a2]')){closeSheet();return csv()}
if(q('[data-lt]')){const b=q('[data-lt]');$$('[data-lt]').forEach(x=>x.classList.toggle('on',x===b));$('#gd').classList.toggle('hide',b.dataset.lt!=='gd');$('#gc').classList.toggle('hide',b.dataset.lt!=='gc');return}
if(q('[data-lsave]')){const ops=[];$$('.lm').forEach(i=>{const v=pm(i.value),per=i.dataset.per,cat=i.dataset.cat;if(v<0)return;if(v!==limOf(per,cat))ops.push({op:'lim.set',per,cat,v})});if(!ops.length)return closeSheet();return act(ops,'Đã lưu hạn mức vào Gsheet')}
if(ED){const v=id=>($('#e_'+id)||{}).value,{kind,o,idx}=ED;
if(q('[data-esave]')){if(kind==='tk'){const nm=v('name').trim(),old=o.name;if(!nm)return toast('Nhập tên tài khoản');
 const r=act([{op:'acc.save',acc:{name:nm,type:v('type'),open:pm(v('open'))},old:old||null}],'Đã lưu');
 r.then(x=>{if(!x.ok)return;if(ED&&ED.ico!==undefined){if(ED.ico)AI[nm]=ED.ico;else delete AI[nm]}else if(old&&old!==nm&&AI[old]){AI[nm]=AI[old]}if(old&&old!==nm)delete AI[old];try{localStorage.aicon=JSON.stringify(AI)}catch(er){}render()});return}
 if(kind==='dm'){if(!v('p').trim()||!v('c').trim())return toast('Nhập hạng mục cha và chi tiết');return act([{op:'cat.save',cat:{t:v('t'),p:v('p').trim(),c:v('c').trim()},old:idx==null?null:{t:o.t,p:o.p,c:o.c}}],'Đã lưu')}}
if(q('[data-edel]')){if(!confirm('Chuyển vào Thùng rác? Dữ liệu vẫn được lưu ở tab DaXoa.'))return;
 if(kind==='tk')return act([{op:'acc.del',name:o.name}],'Đã chuyển vào Thùng rác');if(kind==='dm')return act([{op:'cat.del',cat:{t:o.t,p:o.p,c:o.c}}],'Đã chuyển vào Thùng rác')}return}
if(!E)return;
if(q('[data-ty]')){pull();E.type=q('[data-ty]').dataset.ty;E.cat=E.sub='';form();return}
if(q('[data-dup]')){pull();E={...E,id:newId(),date:ymd(new Date()),isNew:true};form();return}
if(q('[data-del]')){if(!confirm('Chuyển giao dịch vào Thùng rác? Dữ liệu vẫn được lưu ở tab DaXoa và có thể khôi phục.'))return;const id=E.id;closeSheet();commit([{op:'tx.del',id}],{ok:'Đã chuyển vào Thùng rác',local:()=>{S.tx=S.tx.filter(x=>x.id!==id)}});return}
if(q('[data-save]')){pull();const ty=E.type;let er='';
 if(!E.amount)er='Nhập số tiền';else if(E.amount<0&&ty!=='Điều chỉnh')er='Số tiền phải lớn hơn 0';else if(!E.acc)er='Chọn tài khoản';else if(ty==='Chuyển khoản'&&!E.accTo)er='Chọn tài khoản nhận';else if(ty==='Chuyển khoản'&&E.accTo===E.acc)er='Tài khoản nguồn và nhận phải khác nhau';else if(ty!=='Chuyển khoản'&&ty!=='Điều chỉnh'&&(!E.cat||!E.sub))er='Chọn hạng mục và chi tiết';if(er)return toast(er);
 const x=ty==='Chuyển khoản'||ty==='Điều chỉnh',row={id:E.id,date:E.date,type:ty,amount:E.amount,acc:E.acc,accTo:ty==='Chuyển khoản'?E.accTo:'',cat:x?'':E.cat,sub:x?'':E.sub,note:E.note};
 closeSheet();commit([{op:'tx.save',row}],{local:()=>{S.tx=S.tx.filter(t=>t.id!==row.id).concat(row);S.m=row.date.slice(0,7)}}).then(r=>{if(r.ok)limWarn(row)})}});
if(alive())boot();
</script></body></html>
