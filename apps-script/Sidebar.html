<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body{font:13px/1.4 Arial,sans-serif;margin:0;padding:12px;color:#202124}
  label{display:block;margin:10px 0 3px;color:#5f6368;font-size:12px}
  input,select{width:100%;box-sizing:border-box;height:32px;padding:0 8px;border:1px solid #dadce0;border-radius:4px;font:inherit;background:#fff}
  input.amt{height:40px;font-size:20px;font-weight:700;text-align:right}
  .row{display:flex;gap:8px}.row>div{flex:1;min-width:0}
  .seg{display:flex;border:1px solid #dadce0;border-radius:4px;overflow:hidden}
  .seg button{flex:1;height:32px;border:0;background:#fff;cursor:pointer;font:inherit;border-right:1px solid #dadce0}
  .seg button:last-child{border-right:0}
  .seg button.on{background:#e8f0fe;color:#1967d2;font-weight:700}
  .go{width:100%;height:38px;margin-top:14px;border:0;border-radius:4px;background:#1a73e8;color:#fff;font:700 14px Arial;cursor:pointer}
  .go:disabled{opacity:.6;cursor:default}
  #msg{margin-top:10px;min-height:18px;font-size:12px}.ok{color:#188038}.err{color:#d93025}
  .hide{display:none}
</style>
</head>
<body>
<div class="seg" id="ty"></div>
<label>Số tiền (gõ 50k, 1.5tr được)</label>
<input class="amt" id="amt" inputmode="text" placeholder="0" autocomplete="off">
<div class="row">
  <div><label>Ngày</label><input type="date" id="date"></div>
  <div><label>Giờ</label><input type="time" id="time"></div>
</div>
<label id="lAcc">Tài khoản</label>
<select id="acc"></select>
<div id="bTo" class="hide"><label>Đến tài khoản</label><select id="accTo"></select></div>
<div id="bCat">
  <label>Hạng mục</label><select id="cat"></select>
  <label>Chi tiết</label><select id="sub"></select>
</div>
<label>Ghi chú</label>
<input id="note" autocomplete="off" placeholder="Không bắt buộc">
<button class="go" id="go">Lưu giao dịch</button>
<div id="msg"></div>
<script>
var D = null, type = 'Chi';
var $ = function (s) { return document.getElementById(s); };
var U = { k: 1e3, tr: 1e6, m: 1e6, ty: 1e9, b: 1e9 };
function money(v) {
  var s = String(v || '').toLowerCase().replace(/[₫đ\s]/g, ''), neg = s[0] === '-';
  s = s.replace(/^-/, '');
  var m = s.match(/^(\d+)(?:[.,](\d{1,3}))?(k|tr|m|ty|b)$/);
  if (m) { var n = Math.round(parseFloat(m[1] + '.' + (m[2] || '0')) * U[m[3]]); return neg ? -n : n; }
  var d = s.replace(/[^\d]/g, ''); return d ? (neg ? -1 : 1) * Number(d) : 0;
}
function opts(sel, list) { sel.innerHTML = list.map(function (x) { return '<option>' + String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</option>'; }).join(''); }
function setMsg(t, cls) { $('msg').className = cls || ''; $('msg').textContent = t || ''; }
function fillCat() {
  var ps = []; D.cat.forEach(function (c) { if (c.t === type && ps.indexOf(c.p) < 0) ps.push(c.p); });
  opts($('cat'), ps); fillSub();
}
function fillSub() {
  var p = $('cat').value; opts($('sub'), D.cat.filter(function (c) { return c.t === type && c.p === p; }).map(function (c) { return c.c; }));
}
function setType(t) {
  type = t;
  Array.prototype.forEach.call($('ty').children, function (b) { b.className = b.textContent === t ? 'on' : ''; });
  $('bCat').className = (t === 'Chi' || t === 'Thu') ? '' : 'hide';
  $('bTo').className = t === 'Chuyển khoản' ? '' : 'hide';
  $('lAcc').textContent = t === 'Chuyển khoản' ? 'Từ tài khoản' : 'Tài khoản';
  if (t === 'Chi' || t === 'Thu') fillCat();
}
function init(d) {
  D = d;
  $('ty').innerHTML = d.types.map(function (t) { return '<button type="button">' + t + '</button>'; }).join('');
  $('ty').onclick = function (e) { if (e.target.tagName === 'BUTTON') setType(e.target.textContent); };
  opts($('acc'), d.acc); opts($('accTo'), d.acc);
  $('date').value = d.today; $('time').value = d.time;
  $('cat').onchange = fillSub;
  setType('Chi');
}
$('go').onclick = function () {
  var amt = money($('amt').value);
  if (!amt) return setMsg('Nhập số tiền', 'err');
  if (type === 'Chuyển khoản' && $('accTo').value === $('acc').value) return setMsg('Hai tài khoản phải khác nhau', 'err');
  var f = { date: $('date').value, time: $('time').value, type: type, amount: amt, acc: $('acc').value, accTo: type === 'Chuyển khoản' ? $('accTo').value : '',
    cat: (type === 'Chi' || type === 'Thu') ? $('cat').value : '', sub: (type === 'Chi' || type === 'Thu') ? $('sub').value : '', note: $('note').value };
  $('go').disabled = true; setMsg('Đang lưu…');
  google.script.run
    .withSuccessHandler(function () { $('go').disabled = false; $('amt').value = ''; $('note').value = ''; setMsg('Đã lưu giao dịch', 'ok'); $('amt').focus(); })
    .withFailureHandler(function (e) { $('go').disabled = false; setMsg('Lỗi: ' + (e && e.message ? e.message : e), 'err'); })
    .sbSave(f);
};
google.script.run
  .withSuccessHandler(init)
  .withFailureHandler(function (e) { setMsg('Không tải được dữ liệu: ' + (e && e.message ? e.message : e), 'err'); })
  .sbData();
</script>
</body>
</html>
